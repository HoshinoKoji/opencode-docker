services:
  opencode:
    build:
      context: .
      # On Linux this also reaches a host proxy listening on 127.0.0.1.
      network: host
      args:
        - HTTP_PROXY
        - HTTPS_PROXY
        - ALL_PROXY
        - NO_PROXY
    network_mode: host
    stdin_open: true
    tty: true
    # Host networking lets the server bind the chosen host address and port.
    command:
      - serve
      - --hostname
      - ${OPENCODE_BIND_ADDRESS:-0.0.0.0}
      - --port
      - ${OPENCODE_PORT:-14096} # Escape the default port
    environment:
      - GIT_AUTHOR_NAME
      - GIT_AUTHOR_EMAIL
      - GIT_COMMITTER_NAME
      - GIT_COMMITTER_EMAIL
      - HTTP_PROXY
      - HTTPS_PROXY
      - ALL_PROXY
      - NO_PROXY
      - http_proxy
      - https_proxy
      - all_proxy
      - no_proxy
      - OPENCODE_SERVER_PASSWORD
      - OPENCODE_SERVER_USERNAME
    volumes:
      - .:/home/bun/workspace
      - ./config/opencode:/home/bun/.config/opencode
      - opencode-data:/home/bun/.local/share/opencode

volumes:
  opencode-data:

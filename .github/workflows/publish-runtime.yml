name: Publish runtime image

# Manual runs and version tags only. Ordinary main commits never publish.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 0.1.0"
        required: true
        type: string
  push:
    tags:
      - "runtime-v*"

# Serialize all publishes so two runs cannot race the same release tag.
concurrency:
  group: publish-runtime
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/hoshinokoji/opencode-runtime
  SMOKE_IMAGE: opencode-runtime:smoke

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Load pinned tool versions
        run: |
          set -a
          . ./versions.env
          set +a
          {
            echo "BUN_VERSION=$BUN_VERSION"
            echo "NODE_VERSION=$NODE_VERSION"
            echo "UV_VERSION=$UV_VERSION"
            echo "OPENCODE_VERSION=$OPENCODE_VERSION"
            echo "RUST_VERSION=$RUST_VERSION"
          } >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive and validate the version tag
        id: version
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            tag="${GITHUB_REF_NAME#runtime-v}"
          else
            tag="${VERSION_INPUT}"
          fi
          case "$tag" in
            ''|*[!0-9A-Za-z._-]*)
              echo "Invalid version tag: $tag" >&2
              exit 1
              ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Publishing ${IMAGE}:$tag"

      - name: Refuse to overwrite an existing release tag
        run: |
          if docker manifest inspect "${IMAGE}:${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "Refusing to overwrite existing tag ${{ steps.version.outputs.tag }}." >&2
            echo "Bump the version instead of republishing the same tag." >&2
            exit 1
          fi

      - name: Validate shell syntax
        run: |
          set -eu
          sh -n start.sh
          sh -n docker/entrypoint.sh

      - name: Set up uv for the focused launcher checks
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: ${{ env.UV_VERSION }}

      - name: Check configuration mirroring and launcher arguments
        run: uv run --no-project --with pytest pytest tests -q

      - name: Validate the Compose files
        run: |
          set -eu
          docker compose -f compose.yaml config >/dev/null
          docker compose -f compose.yaml -f compose.build.yaml config >/dev/null
          docker compose -f compose.yaml -f compose.build.yaml -f compose.override.example.yaml config >/dev/null

      - name: Build the release image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.tag }}
            ${{ env.IMAGE }}:${{ steps.version.outputs.tag }}-${{ github.sha }}
            ${{ env.SMOKE_IMAGE }}
          labels: |
            org.opencontainers.image.source=https://github.com/HoshinoKoji/opencode-docker
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.tag }}
            io.hoshinokoji.runtime.bun=${{ env.BUN_VERSION }}
            io.hoshinokoji.runtime.node=${{ env.NODE_VERSION }}
            io.hoshinokoji.runtime.uv=${{ env.UV_VERSION }}
            io.hoshinokoji.runtime.opencode=${{ env.OPENCODE_VERSION }}
            io.hoshinokoji.runtime.rust=${{ env.RUST_VERSION }}
          build-args: |
            BUN_VERSION=${{ env.BUN_VERSION }}
            NODE_VERSION=${{ env.NODE_VERSION }}
            UV_VERSION=${{ env.UV_VERSION }}
            OPENCODE_VERSION=${{ env.OPENCODE_VERSION }}
            RUST_VERSION=${{ env.RUST_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test tools and argument passthrough
        run: |
          set -eu
          docker run --rm \
            -e BUN_VERSION -e NODE_VERSION -e UV_VERSION -e OPENCODE_VERSION -e RUST_VERSION \
            "${SMOKE_IMAGE}" sh -c '
            set -eu
            test "$(opencode --version)" = "$OPENCODE_VERSION"
            test "$(node --version)" = "v$NODE_VERSION"
            test "$(bun --version)" = "$BUN_VERSION"
            case "$(uv --version)" in "uv $UV_VERSION"*) ;; *) exit 1 ;; esac
            case "$(cargo --version)" in "cargo $RUST_VERSION "*) ;; *) exit 1 ;; esac
            case "$(rustc --version)" in "rustc $RUST_VERSION "*) ;; *) exit 1 ;; esac
          '
          result=$(docker run --rm "${SMOKE_IMAGE}" sh -c 'printf "%s-%s\n" "$1" "$2"' sh alpha beta)
          test "$result" = "alpha-beta"

      - name: Smoke test the neutral default configuration
        run: |
          set -eu
          config=$(docker run --rm "${SMOKE_IMAGE}" opencode debug config)
          if printf '%s\n' "$config" | grep -qE '"default_agent"[[:space:]]*:[[:space:]]*"(serious|casual|temp)"'; then
            echo "The neutral runtime config must not default to a chat agent." >&2
            exit 1
          fi
          if printf '%s\n' "$config" | grep -q 'serious'; then
            echo "The chat agent leaked into the neutral runtime config." >&2
            exit 1
          fi
          echo "opencode debug config parsed and has no chat default."

      - name: Smoke test writes and Rust compilation (default UID)
        run: |
          set -eu
          docker run --rm "${SMOKE_IMAGE}" sh -c '
            set -eu
            test "$(id -u)" = "1000"
            test ! -w /usr/local/cargo/bin/cargo
            test ! -w /usr/local/rustup/settings.toml
            touch "$HOME/.config/opencode/write-test"
            touch "$HOME/.cache/write-test"
            touch "$CARGO_HOME/write-test"
            printf "%s\n" "fn main() { println!(\"rust-ok\"); }" > "$HOME/hello.rs"
            rustc "$HOME/hello.rs" -o "$HOME/hello"
            "$HOME/hello" | grep -q rust-ok
          '

      - name: Smoke test the chat overlay
        run: |
          set -eu
          config=$(docker run --rm \
            -v "$PWD/config/opencode:/opt/opencode-config-source:ro" \
            -v "$PWD/config/chat:/opt/opencode-profile-source:ro" \
            -e OPENCODE_PROFILE_INPUT=/opt/opencode-profile-source \
            "${SMOKE_IMAGE}" opencode debug config)
          printf '%s\n' "$config" | grep -qE '"default_agent"[[:space:]]*:[[:space:]]*"serious"'

      - name: Smoke test writes and Rust compilation (configured non-root UID)
        run: |
          set -eu
          docker run --rm -e OPENCODE_UID=1500 -e OPENCODE_GID=1500 \
            -e OPENCODE_HOME=/tmp/opencode-1500 \
            -e HOME=/tmp/opencode-1500 \
            "${SMOKE_IMAGE}" sh -c '
              set -eu
              test "$(id -u)" = "1500"
              touch "$HOME/.config/opencode/write-test"
              touch "$HOME/.cache/write-test"
              touch "$CARGO_HOME/write-test"
              mkdir -p "$XDG_DATA_HOME/uv"
              touch "$XDG_DATA_HOME/uv/write-test"
              printf "%s\n" "fn main() { println!(\"rust-ok\"); }" > "$HOME/hello.rs"
              rustc "$HOME/hello.rs" -o "$HOME/hello"
              "$HOME/hello" | grep -q rust-ok
            '
          docker run --rm -e OPENCODE_UID=1500 -e OPENCODE_GID=1500 \
            -e OPENCODE_HOME=/tmp/opencode-1500 \
            "${SMOKE_IMAGE}" opencode debug config >/dev/null

      - name: Smoke test an already-unprivileged process
        run: |
          set -eu
          docker run --rm --user 1500:1500 -e HOME=/tmp/direct-1500 \
            "${SMOKE_IMAGE}" sh -c 'test "$(id -u)" = 1500 && touch "$HOME/.config/opencode/write-test"'

      - name: Push the tested image
        run: |
          set -eu
          # Retag the exact image that passed the smoke tests, then push it.
          docker tag "${SMOKE_IMAGE}" "${IMAGE}:${{ steps.version.outputs.tag }}"
          docker tag "${SMOKE_IMAGE}" "${IMAGE}:${{ steps.version.outputs.tag }}-${{ github.sha }}"
          docker push "${IMAGE}:${{ steps.version.outputs.tag }}"
          docker push "${IMAGE}:${{ steps.version.outputs.tag }}-${{ github.sha }}"

      - name: Report package visibility
        run: |
          echo "Published ${IMAGE}:${{ steps.version.outputs.tag }}."
          echo "If this is the first publish, set the GHCR package visibility to Public"
          echo "so other projects can pull it anonymously:"
          echo "https://github.com/users/HoshinoKoji/packages/container/opencode-runtime/settings"
